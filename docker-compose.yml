version: "3.8"

services:
  server:
    build: ./server
    container_name: shopsmart-backend
    ports:
      - "5001:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - PORT=5000

  client:
    build: ./client
    container_name: shopsmart-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_PROXY_TARGET=http://server:5000
    depends_on:
      - server