name: Build on Push and PR

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - name: Install backend dependencies
        working-directory: server
        run: npm install

      - name: Setup database
        working-directory: server
        env:
          DATABASE_URL: "file:./dev.db"
        run: npx prisma db push

      - name: Lint backend
        working-directory: server
        run: npm run lint

      - name: Test backend
        working-directory: server
        env:
          DATABASE_URL: "file:./dev.db"
        run: npm run test -- --coverage

      - name: Upload backend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: server/coverage/

      - name: Build backend (if present)
        working-directory: server
        run: npm run build --if-present

      - name: Install frontend dependencies
        working-directory: client
        run: npm install

      - name: Lint frontend
        working-directory: client
        run: npm run lint

      - name: Test frontend
        working-directory: client
        run: npx vitest run --coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: client/coverage/

      - name: Build frontend
        working-directory: client
        run: npm run build

  infra:
    name: Terraform Infrastructure
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Cache Terraform state
        uses: actions/cache@v4
        with:
          path: terraform/terraform.tfstate
          key: terraform-state-${{ github.run_id }}
          restore-keys: |
            terraform-state-

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

  deploy:
    name: Build, Push and Deploy to ECS
    runs-on: ubuntu-latest
    needs: infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: shopsmart-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./server
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy new image to ECS
        run: |
          aws ecs update-service \
            --cluster shopsmart-cluster \
            --service shopsmart-backend-service \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

      - name: Verify ECS service is stable
        run: |
          aws ecs wait services-stable \
            --cluster shopsmart-cluster \
            --services shopsmart-backend-service \
            --region ${{ secrets.AWS_REGION }}
          echo "✅ ECS service is running and stable!"